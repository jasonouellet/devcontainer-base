version: '3.8'

services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "20"
        PYTHON_VERSION: "3.11"
    container_name: devcontainer-base
    image: devcontainer-base:latest
    volumes:
      - ..:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "3000:3000"
      - "5000:5000"
      - "8000:8000"
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PYTHONUNBUFFERED=1
    stdin_open: true
    tty: true
    command: /bin/bash
    working_dir: /workspace
