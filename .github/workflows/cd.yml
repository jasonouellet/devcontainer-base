name: CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit SHA of the CI candidate image to promote (required for manual runs)
        required: false
        default: ""
      release_tag:
        description: Release tag (example: v1.0.0) - required for manual runs
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Publish Final Image
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
      packages: write

    steps:
      - name: Resolve promotion inputs
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            SOURCE_SHA="${GITHUB_SHA}"
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          else
            SOURCE_SHA="${{ inputs.source_sha }}"
            RELEASE_TAG="${{ inputs.release_tag }}"
          fi

          # Guardrail: never publish latest without an explicit release tag.
          if [ -z "${RELEASE_TAG}" ]; then
            echo "release_tag is required to publish a final image."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${SOURCE_SHA}" ]; then
            echo "source_sha is required for manual runs."
            exit 1
          fi

          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify candidate image exists
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-${{ steps.vars.outputs.source_sha }}

      - name: Promote candidate to release tag
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.release_tag }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-${{ steps.vars.outputs.source_sha }}

      - name: Promote candidate to latest
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-${{ steps.vars.outputs.source_sha }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.release_tag }}
          name: Release ${{ steps.vars.outputs.release_tag }}
          generate_release_notes: true
          append_body: true
          body: |
            Final image promoted from validated CI candidate:
            - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.release_tag }}
            - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            Candidate source:
            - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-${{ steps.vars.outputs.source_sha }}
          draft: false
          prerelease: false
